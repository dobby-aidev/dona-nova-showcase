<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <!-- Deep Cosmic Obsidian Background -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stopColor="#141824" />
      <stop offset="60%" stopColor="#08090d" />
      <stop offset="100%" stopColor="#030406" />
    </radialGradient>

    <!-- Supernova Outer Atmosphere -->
    <radialGradient id="novaAtmosphere" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#00f0ff" stopOpacity="0.45" />
      <stop offset="45%" stopColor="#38bdf8" stopOpacity="0.25" />
      <stop offset="75%" stopColor="#818cf8" stopOpacity="0.10" />
      <stop offset="100%" stopColor="#000000" stopOpacity="0" />
    </radialGradient>

    <!-- Champagne Platinum Metallic Ring -->
    <linearGradient id="champagneGold" x1="16" y1="16" x2="112" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#ffffff" />
      <stop offset="25%" stopColor="#faebd7" />
      <stop offset="60%" stopColor="#dad3c1" />
      <stop offset="100%" stopColor="#8c826e" />
    </linearGradient>

    <!-- Luminous Cyan Flare -->
    <linearGradient id="electricCyan" x1="10" y1="118" x2="118" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#00f0ff" />
      <stop offset="40%" stopColor="#38bdf8" />
      <stop offset="100%" stopColor="#a855f7" />
    </linearGradient>

    <!-- Glow Filter for High Contrast Browser Tabs -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- High Contrast Rounded Container (Pops in both dark & light tab bars) -->
  <rect width="128" height="128" rx="32" fill="url(#bgGrad)" />
  <rect width="124" height="124" x="2" y="2" rx="30" stroke="url(#champagneGold)" stroke-width="2.5" stroke-opacity="0.4" />

  <!-- Atmospheric Nebula Glow -->
  <circle cx="64" cy="64" r="54" fill="url(#novaAtmosphere)" />

  <!-- Orbital Geometric Telemetry Rings -->
  <circle cx="64" cy="64" r="44" stroke="url(#champagneGold)" stroke-width="2" stroke-opacity="0.6" stroke-dasharray="8 6" />
  <circle cx="64" cy="64" r="34" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.5" stroke-dasharray="3 7" />

  <!-- Hexagonal Quantum Radar Mesh -->
  <polygon points="64,22 100,43 100,85 64,106 28,85 28,43" stroke="url(#electricCyan)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9" />

  <!-- Cardinal Telemetry Ticks -->
  <line x1="64" y1="14" x2="64" y2="24" stroke="#00f0ff" stroke-width="3" stroke-linecap="round" filter="url(#glow)" />
  <line x1="64" y1="104" x2="64" y2="114" stroke="#00f0ff" stroke-width="3" stroke-linecap="round" filter="url(#glow)" />
  <line x1="14" y1="64" x2="24" y2="64" stroke="#00f0ff" stroke-width="3" stroke-linecap="round" filter="url(#glow)" />
  <line x1="104" y1="64" x2="114" y2="64" stroke="#00f0ff" stroke-width="3" stroke-linecap="round" filter="url(#glow)" />

  <!-- Supernova 4-Point Primary Star Flare -->
  <path d="M64 24 Q64 64 104 64 Q64 64 64 104 Q64 64 24 64 Q64 64 64 24 Z" fill="url(#electricCyan)" opacity="0.95" filter="url(#glow)" />

  <!-- Diagonal Secondary Micro-Flares -->
  <path d="M64 42 Q64 64 86 64 Q64 64 64 86 Q64 64 42 64 Q64 64 64 42 Z" fill="#ffffff" opacity="0.85" />

  <!-- Core Quantum Singularity Center -->
  <circle cx="64" cy="64" r="9" fill="#ffffff" filter="url(#glow)" />
  <circle cx="64" cy="64" r="4.5" fill="#00f0ff" />
</svg>
