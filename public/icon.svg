<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <!-- Deep Space Obsidian Rounded Shield Background -->
    <radialGradient id="tabBg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stopColor="#0d1322" />
      <stop offset="65%" stopColor="#06080e" />
      <stop offset="100%" stopColor="#020306" />
    </radialGradient>

    <!-- Supernova Nova Cyan-to-Indigo Glow -->
    <linearGradient id="novaCyanGrad" x1="16" y1="112" x2="112" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#00f0ff" />
      <stop offset="45%" stopColor="#38bdf8" />
      <stop offset="85%" stopColor="#6366f1" />
      <stop offset="100%" stopColor="#a855f7" />
    </linearGradient>

    <!-- Metallic Platinum Border -->
    <linearGradient id="platGrad" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#ffffff" stopOpacity="0.9" />
      <stop offset="50%" stopColor="#94a3b8" stopOpacity="0.4" />
      <stop offset="100%" stopColor="#38bdf8" stopOpacity="0.8" />
    </linearGradient>

    <!-- Intense Central Glow -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Container for high visibility in Chrome dark & light tab bars -->
  <rect width="128" height="128" rx="30" fill="url(#tabBg)" />
  <rect width="124" height="124" x="2" y="2" rx="28" stroke="url(#platGrad)" stroke-width="2.5" stroke-opacity="0.5" />

  <!-- Outer Orbital Telemetry Ring -->
  <circle cx="64" cy="64" r="48" stroke="url(#platGrad)" stroke-width="1.8" stroke-dasharray="8 6" opacity="0.75" />

  <!-- Concentric Inner Gyroscope Arc -->
  <circle cx="64" cy="64" r="36" stroke="url(#novaCyanGrad)" stroke-width="2.2" stroke-dasharray="14 10" opacity="0.9" />

  <!-- Global Infrastructure Hexagon Matrix -->
  <polygon points="64,22 98,42 98,82 64,102 30,82 30,42" stroke="#38bdf8" stroke-width="2" stroke-linejoin="round" fill="none" opacity="0.6" />

  <!-- Four Cardinal Diamond Ticks -->
  <polygon points="64,12 67,16 64,20 61,16" fill="#00f0ff" filter="url(#neonGlow)" />
  <polygon points="64,108 67,112 64,116 61,112" fill="#00f0ff" filter="url(#neonGlow)" />
  <polygon points="12,64 16,67 20,64 16,61" fill="#00f0ff" filter="url(#neonGlow)" />
  <polygon points="108,64 112,67 116,64 112,61" fill="#00f0ff" filter="url(#neonGlow)" />

  <!-- Central Supernova 8-Point Star Core -->
  <path d="M64 26 Q64 64 102 64 Q64 64 64 102 Q64 64 26 64 Q64 64 64 26 Z" fill="url(#novaCyanGrad)" filter="url(#neonGlow)" />
  <path d="M64 36 Q64 64 92 64 Q64 64 64 92 Q64 64 36 64 Q64 64 64 36 Z" fill="#ffffff" opacity="0.85" />

  <!-- Inner Quantum Infrastructure Core -->
  <circle cx="64" cy="64" r="9" fill="#06080e" stroke="url(#platGrad)" stroke-width="2" />
  <circle cx="64" cy="64" r="4.5" fill="#00f0ff" filter="url(#neonGlow)" />
</svg>